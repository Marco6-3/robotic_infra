name: Python contracts
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<2.3' 'pytest>=7,<9' pyyaml
      - run: python -m pytest -q
